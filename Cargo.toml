[workspace]
members = [
    "vlabel-core", "vlabel-gui",
    "vlabel-utils",
]

resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["Will Jiang <dayn9t@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dayn9t/vlabel"

[workspace.dependencies]
# Common dependencies can be defined here and referenced by workspace members
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
json5 = "1"
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = "0.25"

[patch.crates-io]
ashpd = { path = "vendor/ashpd-0.8.1" }
